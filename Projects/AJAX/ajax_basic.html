<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Basic AJAX Demo</title>
		<link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="main">
			<h2>Get The Latest Content:</h2>
			<div class='content' id="content">
				<input type="button" class="button" value="Get Content" id="btn_content" onclick="getContent();"/> <!-- Button to activate the request with AJAX-->
			</div>
		<script type="text/javascript">

            // Assigns XML requesting object
            var ajax = new XMLHttpRequest();

            // Preforms GET action to content.html file
            ajax.open('GET', 'content.html');

            // Changes text on screen when state changes to ready
            ajax.onreadystatechange = function() {
                console.log("STATE HAS CHANGED"); // Logs that state is changed
                if (ajax.readyState == 4) {
                    document.getElementById("content").innerHTML = ajax.responseText; // Recieves text from the content.html file
                }
            }

            // Hides the buttons
            function getContent() {
                ajax.send(); // Sends the file from the GET action
                document.getElementById("btn_content").style.display = 'none';
            }
		</script>
    </body>
</html>
